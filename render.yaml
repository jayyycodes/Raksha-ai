# Render Infrastructure-as-Code Blueprint for Raksha AI (Stage 2 Mid)
# Deploy via Render Dashboard -> Blueprints -> Connect Repository

databases:
  - name: raksha-db
    databaseName: rakshaai
    user: raksha
    plan: starter

services:
  - type: web
    name: raksha-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      sh -c "python -m scripts.apply_migrations &&
             python -m database.seed &&
             uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raksha-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: raksha-frontend
          type: web
          property: host

  - type: worker
    name: raksha-scraper
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scraper.scheduler
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raksha-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: SCRAPE_INTERVAL_HOURS
        value: "4"

  - type: web
    name: raksha-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: raksha-api
          type: web
          property: host

