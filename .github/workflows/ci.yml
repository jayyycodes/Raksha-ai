name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: raksha
          POSTGRES_PASSWORD: raksha
          POSTGRES_DB: rakshaai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: |
          ruff check . --ignore E501,F401,F403,F405

      - name: Set up DB schema
        run: |
          PGPASSWORD=raksha psql -h localhost -U raksha -d rakshaai -f database/schema.sql
          PGPASSWORD=raksha psql -h localhost -U raksha -d rakshaai -f database/migrations/002_source_health.sql

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://raksha:raksha@localhost:5432/rakshaai
        run: |
          pytest -v tests/

